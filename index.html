<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exos-JS-DOM</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Ma To-Do List</h1>

    <form id="todo-form">
        <fieldset>

            <input
            type="text"
            id="task-input"
            placeholder="Entrez une tâche..."
            required
            />

        </fieldset>
        <ul id="todo-list"></ul>
        </form>

</body>
</html>
